[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-smartmv"
version = "1.0.5"
description = "A command-line tool that can decide whether to use 'git mv' or 'mv'."
readme = "README.md"
authors = [
  { name = "James Cherti" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.6, <4"
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX :: Other",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Unix Shell",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/jamescherti/git-smartmv"
Repository = "https://github.com/jamescherti/git-smartmv"

[project.scripts]
git-smartmv = "git_smartmv:command_line_interface"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_smartmv*"]
